<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Ruang Ujian & Juri Pesantren - ID PPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">
    <div class="max-w-md mx-auto w-full p-4 bg-white shadow-md rounded-lg my-8">
        <h1 class="text-xl font-bold text-center text-slate-800 mb-4">Cek Ruang Ujian & Juri</h1>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Masukkan ID PPS:</label>
                <input type="text" id="ppsId" placeholder="Contoh: PPS-12345" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button onclick="checkExam()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Cek Ruang & Juri</button>
        </div>
        <div id="result" class="mt-6 hidden p-4 bg-slate-100 rounded-lg text-sm space-y-2">
            <!-- Hasil pencarian akan muncul di sini -->
        </div>
    </div>
    <script>
        function checkExam() {
            const id = document.getElementById('ppsId').value.trim();
            const resultDiv = document.getElementById('result');
            if(!id) {
                alert('Silakan masukkan ID PPS terlebih dahulu!');
                return;
            }
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `<p class="text-slate-600">Mencari data untuk ID: <b>${id}</b>...</p>`;
            // Simulasi hasil pencarian
            setTimeout(() => {
                resultDiv.innerHTML = `
                    <p class="text-green-600 font-semibold">Data Ditemukan!</p>
                    <p><b>Nama:</b> Santri Contoh</p>
                    <p><b>Ruang Ujian:</b> Ruang A-01</p>
                    <p><b>Juri Penguji:</b> Tim Penguji 1</p>
                `;
            }, 500);
        }
    </script>
</body>
</html>
