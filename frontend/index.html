<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cek Ruang Ujian dan Juri</title>
<style>
:root{--ink:#12241f;--forest:#0f3d33;--amber:#f2b134;--paper:#eef2ef;--card:#fff;--line:#d3dbd6;--muted:#53655f;--err:#a4261c;--ok:#17663f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--forest);color:#fff;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:1.1rem;margin:0;font-weight:700}
.pill{font-size:.8rem;padding:4px 10px;border-radius:99px;font-weight:600;background:#fff;color:var(--ink)}
.pill.on{background:var(--amber)}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:1.5rem;letter-spacing:.06em;padding:12px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-weight:600;min-height:48px;padding:0 16px;border-radius:8px;border:2px solid var(--forest);background:var(--forest);color:#fff;cursor:pointer;flex:1 1 auto}
button.sec{background:#fff;color:var(--forest)}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
video{width:100%;border-radius:8px;margin-top:12px;background:#000;max-height:50vh}
.muted{color:var(--muted);font-size:.9rem;margin:.25rem 0}
.err{color:var(--err);font-weight:600;margin:.25rem 0}
.ok{color:var(--ok);font-weight:600}
.res h2{margin:0;font-size:1.3rem}
.res .id{margin:2px 0 14px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:1.05rem}
.room{background:var(--forest);color:var(--amber);border-radius:8px;padding:14px 16px}
.room .lbl,.juri .lbl{display:block;font-size:.85rem;opacity:.85}
.room strong{font-size:clamp(1.7rem,9vw,2.6rem);line-height:1.1;font-weight:800;word-break:break-word}
.juri{border:2px solid var(--forest);border-radius:8px;padding:10px 16px;margin-top:8px}
.juri strong{font-size:1.8rem}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:14px 0}
dt{color:var(--muted)}dd{margin:0;font-weight:600;word-break:break-word}
summary{font-weight:600;cursor:pointer;min-height:32px}
table{border-collapse:collapse;width:100%;font-size:.85rem;margin:8px 0}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><h1>Cek Ruang Ujian dan Juri</h1><span id="net" class="pill">Online</span></header>
<main>
  <section class="card">
    <form id="f" autocomplete="off">
      <label for="id">ID PPS</label>
      <input type="text" id="id" inputmode="numeric" maxlength="40" placeholder="Contoh: 14451011" enterkeyhint="search">
      <div class="row">
        <button type="submit">Cari</button>
        <button type="button" class="sec" id="scan">Scan Barcode/QR</button>
        <button type="button" class="sec" id="clr">Hapus</button>
      </div>
    </form>
    <div id="cam" hidden>
      <video id="vid" playsinline muted></video>
      <div class="row"><button type="button" class="sec" id="stop">Tutup kamera</button></div>
    </div>
  </section>

  <section id="out" aria-live="polite"></section>

  <section class="card" id="stat"></section>

  <details class="card" id="imp">
    <summary>Impor data baru (admin)</summary>
    <p class="muted">Pilih file DATA_TES (.xlsx atau .xlsm). Seluruh data lama di perangkat ini diganti setelah Anda mengonfirmasi. Impor ini baru berlaku di perangkat ini; belum disinkronkan ke perangkat lain.</p>
    <input type="file" id="file" accept=".xlsx,.xlsm">
    <div id="prev"></div>
    <div class="row"><button type="button" id="apply" hidden>Terapkan data baru</button></div>
  </details>
</main>

<script src="core.js"></script>
<script>
(function () {
'use strict';
var XL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
var ZX = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
var DETAIL = [['DOM','Dom'],['KELAS BARU','Kelas Baru'],['GURU BARU','Guru Baru'],['POS','Pos'],['KELAS PAGI','Kelas Pagi'],['KET TES','Keterangan Tes']];
var $ = function (id) { return document.getElementById(id); };
var map = new Map(), meta = null, stream = null, reader = null, timer = null, pending = null;

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function msg(kind, text) { var o = $('out'); o.textContent = ''; o.append(el('p', kind, text)); }
function loadScript(src) {
  return new Promise(function (ok, no) {
    var s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
    s.onload = ok; s.onerror = function () { no(new Error('Gagal memuat ' + src)); };
    document.head.appendChild(s);
  });
}
async function sha(t) {
  if (!(window.crypto && crypto.subtle)) return '';
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
}

/* ---------- Penyimpanan lokal (IndexedDB) ---------- */
function openDB() {
  return new Promise(function (ok, no) {
    var r = indexedDB.open('idpps-data', 1);
    r.onupgradeneeded = function () { var d = r.result; d.createObjectStore('rows', { keyPath: 'IDPPS' }); d.createObjectStore('meta'); };
    r.onsuccess = function () { ok(r.result); };
    r.onerror = function () { no(r.error); };
  });
}
async function loadAll() {
  var d = await openDB();
  return new Promise(function (ok, no) {
    var t = d.transaction(['rows', 'meta']);
    var a = t.objectStore('rows').getAll(), m = t.objectStore('meta').get('active');
    t.oncomplete = function () { ok({ rows: a.result, meta: m.result || null }); };
    t.onerror = function () { no(t.error); };
  });
}
// Satu transaksi: jika gagal di tengah jalan, data lama tetap utuh.
async function replaceAll(rows, m) {
  var d = await openDB();
  return new Promise(function (ok, no) {
    var t = d.transaction(['rows', 'meta'], 'readwrite');
    var s = t.objectStore('rows'); s.clear();
    rows.forEach(function (r) { s.put(r); });
    t.objectStore('meta').put(m, 'active');
    t.oncomplete = ok;
    t.onerror = function () { no(t.error); };
    t.onabort = function () { no(t.error || new Error('Dibatalkan')); };
  });
}

/* ---------- Tampilan ---------- */
function setNet() { var on = navigator.onLine, p = $('net'); p.textContent = on ? 'Online' : 'Offline'; p.className = 'pill ' + (on ? 'on' : 'off'); }
function renderStatus() {
  var s = $('stat'); s.textContent = '';
  if (!meta) { s.append(el('p', 'muted', 'Belum ada data di perangkat ini. Admin perlu mengimpor file Excel terlebih dahulu.')); return; }
  var d = new Date(meta.importedAt).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
  s.append(el('p', '', 'Versi data ' + meta.version + ': ' + meta.count + ' peserta'),
           el('p', 'muted', 'Diimpor ' + d + ' dari ' + meta.fileName));
}
function show(r) {
  var o = $('out'); o.textContent = '';
  var c = el('article', 'card res');
  c.append(el('h2', '', r['NAMA']), el('p', 'id', r['IDPPS']));
  var room = el('div', 'room'); room.append(el('span', 'lbl', 'Ruang ujian'), el('strong', '', r['RUANG UJIAN']));
  var juri = el('div', 'juri'); juri.append(el('span', 'lbl', 'Juri'), el('strong', '', r['JURI']));
  var dl = el('dl'); DETAIL.forEach(function (x) { dl.append(el('dt', '', x[1]), el('dd', '', r[x[0]])); });
  var b = el('button', 'sec', 'Cari peserta berikutnya'); b.onclick = reset;
  c.append(room, juri, dl, b); o.append(c);
}
function reset() { $('id').value = ''; $('out').textContent = ''; $('id').focus(); }
function doSearch(raw) {
  var id = String(raw || '').trim();
  if (!Core.ID_RE.test(id)) return msg('err', 'ID PPS harus 8 digit angka. Periksa kembali lalu coba lagi.');
  if (!map.size) return msg('err', 'Belum ada data di perangkat ini. Hubungi petugas untuk memuat data.');
  var r = map.get(id);
  if (!r) return msg('err', 'Data peserta tidak ditemukan. Periksa kembali ID PPS Anda atau hubungi petugas.');
  show(r);
}

/* ---------- Scan kamera ---------- */
function stopScan() {
  clearInterval(timer); timer = null;
  if (reader) { try { reader.reset(); } catch (e) {} reader = null; }
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  var v = $('vid'); v.srcObject = null; $('cam').hidden = true;
}
function onCode(text) {
  if (!timer && !reader) return;
  stopScan();
  var id = Core.extractId(text);
  if (!id) return msg('err', 'Format barcode tidak dikenali. Ketik ID PPS secara manual.');
  $('id').value = id; doSearch(id);
}
async function startScan() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return msg('err', 'Kamera tidak tersedia di browser ini. Ketik ID PPS secara manual.');
  try {
    $('cam').hidden = false; $('out').textContent = '';
    var v = $('vid');
    if ('BarcodeDetector' in window) {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      v.srcObject = stream; await v.play();
      var det = new BarcodeDetector();
      timer = setInterval(async function () {
        try { var r = await det.detect(v); if (r.length) onCode(r[0].rawValue); } catch (e) {}
      }, 300);
    } else {
      await loadScript(ZX);
      reader = new ZXing.BrowserMultiFormatReader();
      reader.decodeFromVideoDevice(undefined, 'vid', function (res) { if (res) onCode(res.getText()); });
    }
  } catch (e) {
    stopScan();
    msg('err', e && e.name === 'NotAllowedError'
      ? 'Izin kamera ditolak. Izinkan kamera di pengaturan browser, atau ketik ID PPS secara manual.'
      : 'Pemindaian tidak dapat dimulai. Ketik ID PPS secara manual.');
  }
}

/* ---------- Impor Excel ---------- */
$('file').onchange = async function (e) {
  var f = e.target.files[0], p = $('prev'); pending = null; $('apply').hidden = true; p.textContent = '';
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) return p.append(el('p', 'err', 'File terlalu besar (maksimal 10 MB).'));
  try {
    p.append(el('p', 'muted', 'Membaca file...'));
    await loadScript(XL);
    var wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    var name = wb.SheetNames[0];
    var m = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
    var v = Core.validate(m); p.textContent = '';
    if (v.fatal) return p.append(el('p', 'err', v.fatal));
    p.append(el('p', '', 'Sheet "' + name + '": ' + v.source + ' baris sumber, ' + v.rows.length + ' valid, ' + v.rejected.length + ' ditolak, ' + v.emptyCells + ' sel kosong.'));
    v.rejected.slice(0, 20).forEach(function (x) { p.append(el('p', 'err', 'Baris ' + x.line + ': ' + x.reason)); });
    if (v.rejected.length > 20) p.append(el('p', 'muted', 'Dan ' + (v.rejected.length - 20) + ' baris lain.'));
    if (!v.rows.length) return p.append(el('p', 'err', 'Tidak ada baris valid, data lama tidak diganti.'));
    var wrap = el('div', 'scroll'), tb = el('table'), hd = el('tr');
    ['IDPPS', 'NAMA', 'RUANG UJIAN', 'JURI'].forEach(function (h) { hd.append(el('th', '', h)); });
    tb.append(hd);
    v.rows.slice(0, 5).forEach(function (r) { var tr = el('tr'); ['IDPPS', 'NAMA', 'RUANG UJIAN', 'JURI'].forEach(function (k) { tr.append(el('td', '', r[k])); }); tb.append(tr); });
    wrap.append(tb); p.append(el('p', 'muted', 'Pratinjau 5 baris pertama:'), wrap);
    pending = { v: v, name: f.name }; $('apply').hidden = false;
  } catch (err) {
    p.textContent = ''; p.append(el('p', 'err', 'File tidak dapat dibaca. Pastikan formatnya .xlsx atau .xlsm yang benar dan perangkat sedang online untuk memuat pembaca Excel.'));
  }
};
$('apply').onclick = async function () {
  if (!pending) return;
  var v = pending.v, name = pending.name;
  if (!confirm('Ganti seluruh data di perangkat ini dengan ' + v.rows.length + ' peserta dari ' + name + '?' + (v.rejected.length ? ' ' + v.rejected.length + ' baris yang ditolak tidak akan dimuat.' : ''))) return;
  try {
    var m = { version: (meta ? meta.version : 0) + 1, importedAt: Date.now(), fileName: name, count: v.rows.length, rejected: v.rejected.length, checksum: await sha(JSON.stringify(v.rows)) };
    await replaceAll(v.rows, m);
    await boot();
    pending = null; $('apply').hidden = true; $('prev').textContent = ''; $('file').value = '';
    msg('ok', 'Data baru diterapkan: ' + m.count + ' peserta.');
  } catch (e) { msg('err', 'Data gagal disimpan. Data lama tetap dipakai.'); }
};

/* ---------- Mulai ---------- */
async function boot() {
  try { var d = await loadAll(); map = new Map(d.rows.map(function (r) { return [r.IDPPS, r]; })); meta = d.meta; }
  catch (e) { map = new Map(); meta = null; msg('err', 'Penyimpanan lokal tidak dapat dibuka di browser ini.'); }
  renderStatus();
}
$('f').onsubmit = function (e) { e.preventDefault(); doSearch($('id').value); };
$('clr').onclick = reset;
$('scan').onclick = startScan;
$('stop').onclick = stopScan;
addEventListener('online', setNet); addEventListener('offline', setNet);
setNet(); boot();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
</body>
</html>
